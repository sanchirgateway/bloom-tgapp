server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Отдаём готовые .gz из сборки, остальное (если появится) сжимаем на лету
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    # Без X-Frame-Options: web.telegram.org открывает мини-апп во фрейме

    # Файлы с хэшем в имени не меняются — кэш на год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # index.html — всегда свежий, иначе Telegram WebView держит старую версию со ссылками на удалённые ассеты
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
